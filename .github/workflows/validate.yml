name: Validate

on:
  push:
    branches: [main, 'codex/sdk-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run tests and repository checks
        run: npm test

      - name: Install the representative locked SDK tree without lifecycle scripts
        working-directory: cloudfunctions/sendMessage
        run: npm ci --ignore-scripts --omit=dev --no-audit --no-fund

      - name: Run installed SDK contracts with synthetic transport and loopback HTTP
        run: npm run test:sdk
